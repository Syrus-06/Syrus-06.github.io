<header class="wah-header" role="banner">
  <div class="wah-inner">
    <a class="wah-brand" rel="author" href="{{ "/" | relative_url }}">
      <span class="wah-mark" aria-hidden="true">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 56" fill="none">
          <path d="M14 48 C 14 14, 106 14, 106 48" stroke="currentColor" stroke-width="3.2" fill="none"/>
          <circle cx="14" cy="48" r="4.2" fill="currentColor"/>
          <circle cx="106" cy="48" r="4.2" fill="currentColor"/>
        </svg>
      </span>
      <span class="wah-wordmark">
        <span class="wah-name">Winter Arc</span>
        <span class="wah-hub">Hub</span>
      </span>
    </a>

    <input type="checkbox" class="wah-nav-trigger" id="nav-trigger" />
    <label for="nav-trigger" class="wah-burger">
      <span class="visually-hidden">Menu</span>
      <span class="wah-burger-lines" aria-hidden="true">
        <span></span>
        <span></span>
        <span></span>
      </span>
    </label>

    <nav class="wah-nav" aria-label="Primary">
      <a href="{{ "/" | relative_url }}" class="wah-link{% if page.url == '/' %} is-active{% endif %}">Home</a>
      <a href="{{ "/about/" | relative_url }}" class="wah-link{% if page.url == '/about/' %} is-active{% endif %}">About</a>
      <a href="{{ "/disclosure/" | relative_url }}" class="wah-link{% if page.url == '/disclosure/' %} is-active{% endif %}">Disclosure</a>
    </nav>
  </div>
</header>
