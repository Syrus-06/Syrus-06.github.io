<header class="site-header wah-header" role="banner">
  <input type="checkbox" id="wah-nav-toggle" class="wah-nav-toggle" />

  <div class="wah-bar">
    <label for="wah-nav-toggle" class="wah-burger" id="wah-burger" aria-controls="wah-drawer" aria-expanded="false">
      <span class="wah-burger-icon" aria-hidden="true">
        <span></span>
        <span></span>
        <span></span>
      </span>
      <span class="visually-hidden">Open shop menu</span>
    </label>

    <a class="wah-brand" rel="author" href="{{ "/" | relative_url }}" aria-label="Winter Arc Hub home">
      <span class="wah-mark" aria-hidden="true">
        {% include logo-mark.html %}
      </span>
      <span class="wah-title">Winter Arc Hub</span>
    </a>

    <nav class="wah-pages" aria-label="Site">
      <a class="wah-page{% if page.url == '/about/' %} is-active{% endif %}" href="{{ "/about/" | relative_url }}">About</a>
      <a class="wah-page{% if page.url == '/disclosure/' %} is-active{% endif %}" href="{{ "/disclosure/" | relative_url }}">Disclosure</a>
    </nav>
  </div>

  <label for="wah-nav-toggle" class="wah-overlay" aria-hidden="true"></label>

  <aside class="wah-drawer" id="wah-drawer" aria-label="Shop menu">
    <div class="wah-drawer-head">
      <p class="wah-drawer-kicker">Winter Arc</p>
      <p class="wah-drawer-heading">Shop</p>
      <label for="wah-nav-toggle" class="wah-close">
        <span aria-hidden="true">&times;</span>
        <span class="visually-hidden">Close shop menu</span>
      </label>
    </div>

    <nav class="wah-shop" aria-label="Product categories">
      {% for category in site.data.shop %}
        <details class="wah-cat">
          <summary class="wah-cat-summary">
            <span>{{ category.title }}</span>
            <span class="wah-caret" aria-hidden="true"></span>
          </summary>
          <div class="wah-cat-items">
            {% for item in category.items %}
              <a class="wah-cat-link" href="{{ item.url | relative_url }}">{{ item.title }}</a>
            {% endfor %}
          </div>
        </details>
      {% endfor %}
    </nav>
  </aside>
</header>
